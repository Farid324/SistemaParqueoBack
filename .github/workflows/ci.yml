name: Continuous Integration (CI)

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sistemaparqueodb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistemaparqueodb_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sistemaparqueodb_test?schema=public
      JWT_SECRET: ci-test-secret-please-change-me-in-real-envs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter (ESLint)
        run: pnpm run lint

      - name: Check Code Formatting (Prettier)
        run: pnpm run format:check

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Run Database Migrations
        run: pnpm exec prisma migrate deploy

      - name: Compile Application
        run: pnpm run build

      - name: Run Unit Tests
        run: pnpm run test
